<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF6E7"/>
      <stop offset="1" stop-color="#F6DCAE"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1C1917" flood-opacity="0.25"/>
    </filter>
    <!-- Map pin with a cup inside, anchored at its tip (0,0). -->
    <g id="pin">
      <path d="M0 0 C-6 -16 -26 -30 -26 -50 A26 26 0 1 1 26 -50 C26 -30 6 -16 0 0 Z" fill="#B45309"/>
      <circle cx="0" cy="-50" r="17" fill="#FFFBEB"/>
      <path d="M-9 -56 h14 v9 a7 7 0 0 1 -7 7 a7 7 0 0 1 -7 -7 Z" fill="#B45309"/>
      <path d="M5 -53 a4 4 0 0 1 0 8" stroke="#B45309" stroke-width="2.5" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Coastline / water on the right -->
  <path d="M1200 0 H930 C900 70 960 130 920 200 C880 270 960 330 930 410 C905 480 980 540 960 630 H1200 Z" fill="url(#water)" opacity="0.75"/>
  <path d="M930 0 C900 70 960 130 920 200 C880 270 960 330 930 410 C905 480 980 540 960 630" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>

  <!-- River -->
  <path d="M0 470 C160 440 260 520 400 500 C540 480 600 400 720 410 C820 418 880 380 925 360" stroke="#93C5FD" stroke-width="22" stroke-linecap="round" opacity="0.8"/>

  <!-- Parks -->
  <rect x="120" y="120" width="130" height="90" rx="14" fill="#BBF7D0" opacity="0.8"/>
  <rect x="620" y="470" width="150" height="100" rx="14" fill="#BBF7D0" opacity="0.8"/>
  <circle cx="820" cy="150" r="48" fill="#BBF7D0" opacity="0.8"/>

  <!-- Street grid -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.95">
    <path d="M0 90 H930" stroke-width="10"/>
    <path d="M0 250 H905" stroke-width="16"/>
    <path d="M0 380 H920" stroke-width="10"/>
    <path d="M0 580 H960" stroke-width="10"/>
    <path d="M90 0 V630" stroke-width="10"/>
    <path d="M300 0 V630" stroke-width="16"/>
    <path d="M520 0 V630" stroke-width="10"/>
    <path d="M700 0 V630" stroke-width="10"/>
    <path d="M40 620 L880 30" stroke-width="12"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="5" opacity="0.6">
    <path d="M0 170 H930"/>
    <path d="M0 320 H910"/>
    <path d="M0 520 H950"/>
    <path d="M200 0 V630"/>
    <path d="M410 0 V630"/>
    <path d="M610 0 V630"/>
    <path d="M800 0 V630"/>
  </g>

  <!-- Dashed links from each shop to the hub card -->
  <g stroke="#B45309" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7">
    <path d="M200 205 L470 300"/>
    <path d="M410 470 L520 380"/>
    <path d="M700 205 L640 280"/>
    <path d="M840 470 L700 380"/>
    <path d="M1030 260 L740 300"/>
  </g>

  <!-- Shops -->
  <g filter="url(#shadow)">
    <use href="#pin" x="200" y="205"/>
    <use href="#pin" x="410" y="470"/>
    <use href="#pin" x="700" y="205"/>
    <use href="#pin" x="840" y="470"/>
    <use href="#pin" x="1030" y="260"/>
  </g>
  <g font-size="17" font-weight="600" fill="#78350F">
    <rect x="148" y="214" width="104" height="30" rx="15" fill="#FFFBEB" opacity="0.95"/>
    <text x="200" y="235" text-anchor="middle">Market Ln</text>
    <rect x="358" y="479" width="104" height="30" rx="15" fill="#FFFBEB" opacity="0.95"/>
    <text x="410" y="500" text-anchor="middle">Station Rd</text>
    <rect x="648" y="214" width="104" height="30" rx="15" fill="#FFFBEB" opacity="0.95"/>
    <text x="700" y="235" text-anchor="middle">Park Ave</text>
    <rect x="788" y="479" width="104" height="30" rx="15" fill="#FFFBEB" opacity="0.95"/>
    <text x="840" y="500" text-anchor="middle">Riverside</text>
    <rect x="978" y="269" width="104" height="30" rx="15" fill="#FFFBEB" opacity="0.95"/>
    <text x="1030" y="290" text-anchor="middle">Beach Rd</text>
  </g>

  <!-- Hub: one account, all shops -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="280" width="290" height="110" rx="22" fill="#1C1917"/>
  </g>
  <rect x="460.5" y="280.5" width="289" height="109" rx="21.5" stroke="#D97706" stroke-opacity="0.45"/>
  <text x="488" y="316" fill="#FBBF24" font-size="15" font-weight="700" letter-spacing="2">ALL SHOPS</text>
  <text x="488" y="352" fill="#FFFFFF" font-size="30" font-weight="700">5 locations</text>
  <text x="488" y="376" fill="#A8A29E" font-size="15">one account · one team</text>
  <g transform="translate(672 318)">
    <rect x="0" y="34" width="10" height="20" rx="3" fill="#D97706" opacity="0.55"/>
    <rect x="16" y="20" width="10" height="34" rx="3" fill="#D97706" opacity="0.7"/>
    <rect x="32" y="8" width="10" height="46" rx="3" fill="#F59E0B"/>
    <rect x="48" y="26" width="10" height="28" rx="3" fill="#D97706" opacity="0.7"/>
  </g>
</svg>
